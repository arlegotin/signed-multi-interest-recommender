name: Synthetic checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU runtime and development tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,build]'
      - run: python -m pip check
      - name: Record numerical runtime and synthetic tie behavior
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import numpy as np
          from threadpoolctl import threadpool_info
          from signed_study.data import History
          from signed_study.models import fit_user, score_user
          print({name: version(name) for name in ('numpy', 'scipy', 'scikit-learn')})
          print(threadpool_info())
          class IdenticalRows:
              def rows(self, ids):
                  rows = np.zeros((len(ids), 384))
                  rows[:, 0] = 1
                  return rows
          for positive, negative, candidates in ((10, 5, 10), (11, 6, 11)):
              history = History(1, 100, 'development', tuple(range(positive)),
                                tuple(range(100, 100 + negative)))
              for C in (.01, .1, 1, 10, 100):
                  model = fit_user('RBFSVM', history, IdenticalRows(), {'C': C, 'g': 1})
                  scores = {chunk: score_user(model, range(200, 200 + candidates),
                            IdenticalRows(), chunk_size=chunk).tolist() for chunk in (1, 512)}
                  print({'supports': [positive, negative], 'C': C, 'scores': scores})
                  assert len(set(scores[1])) == 1
          PY
      - run: python -m pytest -q --durations=10
      - run: python scripts/verify_public_results.py
      - run: python -m signed_study --help
      - name: Check lazy CLI imports
        run: python -c "import runpy,sys; sys.argv=['signed_study','--help']; exec(\"try:\n runpy.run_module('signed_study',run_name='__main__')\nexcept SystemExit as e:\n assert e.code == 0\"); assert 'torch' not in sys.modules; assert 'sentence_transformers' not in sys.modules"
      - run: python -m build
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv /tmp/signed-wheel
          /tmp/signed-wheel/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/signed-wheel/bin/python -m pip install dist/*.whl
          cp config/study.json /tmp/signed-wheel-config.json
          cd /tmp
          /tmp/signed-wheel/bin/python -m signed_study --help
          /tmp/signed-wheel/bin/python -c "from signed_study.retrieval import GramCatalog; c=GramCatalog([1], [[1.,0.]]); assert c.topk([[1.,0.]], [], 0, k=1).item_ids.tolist()==[1]"
          /tmp/signed-wheel/bin/python - <<'PY'
          from pathlib import Path
          import shutil, tempfile
          from signed_study.report import report_config, render_report
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              try:
                  report_config(root)
              except ValueError as error:
                  assert 'config_path' in str(error)
              else:
                  raise AssertionError('Missing checkout configuration must be explicit')
              shutil.copyfile('/tmp/signed-wheel-config.json', root / 'resolved_config.json')
              assert render_report(root)['outcome'] == 'inconclusive evidence'
          PY
      - run: git diff --check
