[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signed-study"
version = "0.1.0"
description = "A bounded study of signed multi-interest recommendation"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "torch",
    "sentence-transformers",
    "huggingface-hub",
    "psutil",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
