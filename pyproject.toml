[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "signed-study"
version = "0.2.0"
description = "Reproducible study of explicit-negative ranking on frozen content embeddings"
authors = [{name = "Artem Legotin"}]
license = "AGPL-3.0-only AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "LICENSING.md", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>=1.8,<2",
    "torch",
    "sentence-transformers",
    "huggingface-hub",
    "psutil",
    "matplotlib",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["build>=1.2"]

[project.urls]
Repository = "https://github.com/arlegotin/signed-multi-interest-recommender"
Results = "https://github.com/arlegotin/signed-multi-interest-recommender/blob/main/docs/study-outcome.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
